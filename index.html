<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <title>ROGUE COMBO — 액션 로그라이크 프로토타입</title>
  <style>
:root {
  --bg: #0b0c14; --panel: rgba(16, 18, 32, 0.94); --line: rgba(255,255,255,0.14);
  --text: #e8e8f0; --dim: #8a8fa8; --gold: #ffd700; --phys: #ffb347; --magic: #b58cff; --pass: #7cff9c;
  --font: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
body { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 10px; }
#app { position: relative; width: 960px; max-width: 100%; aspect-ratio: 16 / 9; }
#game { width: 100%; height: 100%; display: block; background: #0f1020; border-radius: 10px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); image-rendering: auto; }
#ui { position: absolute; inset: 0; pointer-events: none; z-index: 10; }
#ui .panel { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: auto; background: rgba(0,0,0,0.45); }
#ui .panel[hidden] { display: none; }
#ui .panel-toast { background: none; pointer-events: none; align-items: flex-start; padding-top: 120px; }
.footer { color: var(--dim); font-size: 12px; margin: 0; text-align: center; max-width: 960px; }

.win { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 20px 24px; max-width: 92%; max-height: 94%; overflow: auto; box-shadow: 0 12px 40px rgba(0,0,0,0.7); }
.win.wide { width: 92%; }
.win h1 { margin: 0 0 6px; font-size: 34px; letter-spacing: 2px; color: var(--gold); }
.win h2 { margin: 0 0 8px; font-size: 20px; }
.win h3 { margin: 14px 0 6px; font-size: 14px; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.win h3 small { color: var(--dim); font-weight: normal; margin-left: 6px; }
.win .sub { color: var(--dim); margin: 0 0 12px; font-size: 13px; }
.win .note { color: #cfd8ff; font-size: 13px; }
.win .small { font-size: 12px; color: #c8c8d8; }
.win.dead h1 { color: #ff6b6b; }
.win.title { text-align: center; }
.win header { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.win header .hint { color: var(--dim); font-size: 12px; flex: 1; }
.win header .x { margin-left: auto; }
.win footer { margin-top: 12px; font-size: 12px; color: var(--dim); }
.win ul { margin: 4px 0; padding-left: 18px; }
.win ul.inline { display: flex; flex-wrap: wrap; gap: 4px 16px; padding: 0; list-style: none; }

button { font-family: var(--font); cursor: pointer; border: 1px solid var(--line); background: #232640; color: var(--text); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
button:hover { background: #2f3358; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button.big { font-size: 18px; padding: 12px 36px; margin-top: 14px; background: #3a2f6b; border-color: #7b6bd6; }
button.big:hover { background: #4b3d8a; }
button.x { padding: 2px 8px; }

.controls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px 18px; text-align: left; font-size: 13px; margin: 14px auto; max-width: 720px; }
.controls b { color: var(--gold); margin-right: 6px; }

.cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.card { width: 230px; padding: 16px; border-radius: 12px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; background: #1b1e33; }
.card.gender { width: 180px; }
.card:hover { transform: translateY(-3px); border-color: var(--gold); }
.avatar { width: 70px; height: 90px; border-radius: 12px; margin-bottom: 6px; }
.avatar.m { background: linear-gradient(#3b2a1a 0 22%, #ffd9b3 22% 40%, #4f8cff 40% 78%, #2b2b3a 78%); }
.avatar.f { background: linear-gradient(#7a2e4a 0 22%, #ffd9b3 22% 40%, #ff6fa8 40% 78%, #2b2b3a 78%); }
.skill-card .ic { font-size: 38px; }
.skill-card .badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #333; }
.skill-card.t-physical .badge { background: #6b4a1a; color: var(--phys); }
.skill-card.t-magic .badge { background: #3d2a6b; color: var(--magic); }
.skill-card.t-passive .badge { background: #1f5a33; color: var(--pass); }
.skill-card b { font-size: 17px; }
.skill-card .lv { color: var(--gold); font-size: 12px; }
.skill-card .cmd { font-size: 15px; color: #fff; letter-spacing: 2px; }
.skill-card .desc { font-size: 12px; color: var(--dim); }

.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.cols3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
@media (max-width: 800px) { .cols2, .cols3, .controls { grid-template-columns: 1fr; } }

.skill { display: flex; gap: 10px; align-items: flex-start; padding: 8px; border-radius: 8px; margin-bottom: 6px; background: rgba(255,255,255,0.04); border: 1px solid transparent; }
.skill.on { border-color: rgba(255,215,0,0.35); background: rgba(255,215,0,0.06); }
.skill.locked { opacity: 0.55; }
.skill .ic { font-size: 22px; width: 28px; text-align: center; }
.skill .body { flex: 1; font-size: 12px; }
.skill .body b { font-size: 14px; }
.skill .lv { color: var(--gold); margin-left: 4px; }
.skill .cmd { color: #fff; margin-left: 6px; letter-spacing: 1px; }
.skill .desc { color: var(--dim); margin-top: 2px; }
.skill .req { color: #ff9c9c; margin-top: 2px; font-size: 11px; }
.skill .req.ok { color: var(--pass); }
.skill .slots { display: flex; gap: 3px; }
.skill .slots button { padding: 2px 7px; font-size: 11px; }
.skill .slots button.sel { background: var(--gold); color: #000; border-color: var(--gold); }

table.stats { width: 100%; border-collapse: collapse; font-size: 13px; }
table.stats td { padding: 3px 4px; border-bottom: 1px solid rgba(255,255,255,0.06); }
table.stats td.pb { width: 40%; }
table.stats td.pb i { display: block; height: 6px; background: var(--gold); border-radius: 3px; }
.eq { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.eq .lbl { color: var(--dim); width: 52px; }
.eq button { margin-left: auto; padding: 2px 8px; font-size: 11px; }
.dim { color: var(--dim); }
.items { max-height: 260px; overflow: auto; }
.item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 5px 0; font-size: 13px; border-bottom: 1px solid rgba(255,255,255,0.06); }
.item small { color: var(--dim); }
.item small .ok { color: var(--pass); }
.item small .no { color: #ff9c9c; }
.item button { padding: 2px 10px; font-size: 12px; }

.mz { display: grid; gap: 4px; justify-content: center; padding: 10px 0; }
.mc { width: 72px; height: 56px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,0.05); border: 3px solid transparent; box-sizing: border-box; border-radius: 4px; }
.mc small { font-size: 10px; color: #ddd; }
.mc.v { background: #3a3a55; }
.mc.v.t-boss { background: #6a2040; } .mc.v.t-stairs { background: #2a5a4a; } .mc.v.t-escape { background: #245a70; }
.mc.v.t-treasure { background: #6a5a20; } .mc.v.t-rest { background: #6a4a20; } .mc.v.t-elite { background: #6a3030; } .mc.v.t-start { background: #3a5a80; }
.mc.cur { box-shadow: 0 0 0 2px var(--gold), 0 0 14px rgba(255,215,0,0.6); }
.mc.k { color: var(--gold); border: 2px dashed rgba(255,215,0,0.5); font-weight: bold; }
.mc.u { opacity: 0.12; }
.win header .hint span.on { color: var(--gold); font-weight: bold; }

.toast { background: rgba(60, 20, 90, 0.92); border: 1px solid var(--magic); border-radius: 12px; padding: 14px 28px; text-align: center; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 0 30px rgba(181,140,255,0.5); animation: pop 0.3s ease-out; }
.toast b { font-size: 24px; color: #ff9cf0; }
.toast span { font-size: 13px; color: #ddd; }
@keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

.card.picked { border-color: var(--pass); background: #1f3a2a; opacity: 0.85; }
.card:disabled { cursor: default; transform: none; }
.win .row { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 14px; }
.win .row .big { margin-top: 0; }
.win h2 .pts { color: var(--gold); font-size: 15px; margin-left: 10px; }
.win h2 .hint { color: var(--dim); font-size: 12px; margin-left: 8px; font-weight: normal; }

button.big.alt { background: #2f5a3a; border-color: #6bd68a; }
.win .row.wrap { flex-wrap: wrap; }
.mc.v.t-rescue { background: #5a3a6a; } .mc.v.t-sanctuary { background: #6a5a30; }

.prow { display: flex; gap: 20px; align-items: flex-start; justify-content: center; }
.win.puzzle.compact { padding: 8px 12px; max-height: 98%; }
.win.puzzle.compact h2 { font-size: 14px; margin: 0 0 4px; }
.win.puzzle.compact .prow { gap: 12px; }
.win.puzzle.compact .pref { gap: 4px; font-size: 11px; }
.win.puzzle.compact .pref button { font-size: 12px; padding: 5px 10px; }
.win.puzzle .pref { justify-content: center; }
.win.puzzle .pref .ok { color: var(--pass); font-size: 13px; }
.pgrid { display: grid; gap: 0; background: #0b0c14; border: 3px solid var(--gold); border-radius: 6px; overflow: hidden; }
.pt { position: relative; padding: 0; border: 1px solid rgba(0,0,0,0.6); border-radius: 0; background-color: #111; cursor: default; }
.pt.mv { cursor: pointer; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35); }
.pt.mv:hover { filter: brightness(1.25); }
.pt.empty { background: #05060a; }
.pt span { position: absolute; left: 4px; top: 2px; font-size: 11px; color: rgba(255,255,255,0.75); text-shadow: 0 0 3px #000; }
.pref { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.pref img { border: 2px solid var(--line); border-radius: 6px; }
.row .ok { color: var(--pass); font-size: 16px; }

.bag { display: grid; grid-template-columns: repeat(10, 34px); gap: 3px; padding: 6px; background: rgba(0,0,0,0.35); border: 1px solid var(--line); border-radius: 8px; max-height: 190px; overflow: auto; }
.bs { position: relative; width: 34px; height: 34px; padding: 0; border-radius: 5px; background: #1b1e33; border: 1px solid rgba(255,255,255,0.12); font-size: 18px; line-height: 1; }
.bs.empty { background: rgba(255,255,255,0.03); border-style: dashed; }
.bs.sel { border-color: var(--gold); box-shadow: 0 0 8px rgba(255,215,0,0.6); }
.bs.k-eq { border-color: rgba(255,179,71,0.45); } .bs.k-recipe { border-color: rgba(181,140,255,0.55); } .bs.k-consumable { border-color: rgba(124,255,156,0.4); }
.bs .ct { position: absolute; right: 1px; bottom: 0; font-size: 10px; color: #fff; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.bdetail { margin-top: 8px; padding: 8px; background: rgba(255,255,255,0.05); border-radius: 8px; font-size: 13px; }
.win .row.left { justify-content: flex-start; margin-top: 8px; flex-wrap: wrap; gap: 6px; }
.items.tall { max-height: 300px; }
.item .acts { display: flex; gap: 4px; align-items: center; }
.eq small { display: block; color: var(--dim); font-size: 11px; }

/* ── 터치 조작층 ───────────────────────────────────────── */
#touch { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; font-family: var(--font); }
#touch[hidden] { display: none; }
#touch .tb { pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; position: absolute; border-radius: 50%; background: rgba(20,22,40,0.38); border: 1.5px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.9); font-weight: bold; font-size: 12px; padding: 0; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
#touch .tb.down { background: rgba(255,215,0,0.55); border-color: var(--gold); }
#touch .tb.sm { position: static; border-radius: 8px; font-size: 12px; padding: 5px 9px; white-space: nowrap; }
#touch .ttop { position: absolute; top: 3px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; pointer-events: none; }
#touch .ttop .tb { pointer-events: auto; }
#touch .tpad { pointer-events: auto; touch-action: none; position: absolute; left: 14px; bottom: 14px; width: 118px; height: 118px; border-radius: 50%; background: rgba(20,22,40,0.28); border: 1.5px solid rgba(255,255,255,0.25); }
#touch .tpad-ring { position: absolute; inset: 34px; border-radius: 50%; border: 1px dashed rgba(255,255,255,0.2); }
#touch .tpad-knob { position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; background: rgba(255,255,255,0.28); border: 2px solid rgba(255,255,255,0.6); pointer-events: none; }
#touch .tpad.down .tpad-knob { background: rgba(255,215,0,0.5); }
#touch .tbtns .tb { width: 50px; height: 50px; }
#touch .b-attack { right: 14px; bottom: 44px; width: 66px !important; height: 66px !important; background: rgba(180,40,60,0.45); }
#touch .b-guard { right: 88px; bottom: 18px; }
#touch .b-dodge { right: 88px; bottom: 78px; }
#touch .b-jump { right: 22px; bottom: 116px; }
#touch .tskills { position: absolute; right: 150px; bottom: 14px; display: flex; gap: 6px; pointer-events: none; }
#touch .tskills .tb { position: static; width: 40px; height: 40px; font-size: 16px; }
#touch .tskills .tb.cd { color: #ffd700; font-size: 11px; background: rgba(0,0,0,0.5); }
#touch .tskills .tb.empty { opacity: 0.45; }
#touch .tskills .mag { width: 46px; font-size: 11px; background: rgba(90,60,140,0.5); }
#touch .tskills .mag.on { background: rgba(181,140,255,0.8); border-color: #fff; }
.linkbtn { background: none; border: none; color: var(--dim); text-decoration: underline; padding: 0; font-size: 12px; }
#rotate-hint { display: none; position: absolute; inset: 0; z-index: 20; background: #0b0c14; color: #fff; font-size: 22px; align-items: center; justify-content: center; }
@media (max-width: 1000px) { html, body { height: 100%; background: #000; } body { padding: 0; gap: 0; justify-content: center; } .footer { display: none; } #app { aspect-ratio: auto; margin: 0 auto; max-width: none; } #game { border-radius: 0; box-shadow: none; } }
/* 폰: 게임 박스를 보이는 영역 중앙에 고정 (주소창·스크롤 영향 없음) */
body.mobile { overflow: hidden; position: fixed; inset: 0; margin: 0; padding: 0; background: #000; display: block; }
body.mobile #app { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); margin: 0; }
body.mobile .footer { display: none; }
@media (orientation: portrait) and (max-width: 900px) { #rotate-hint { display: flex; } }

.win.intro { max-width: 640px; text-align: center; }
.intro-icon { font-size: 44px; margin-bottom: 4px; }
.intro-body { font-size: 14px; line-height: 1.7; color: #e0e0ea; text-align: left; margin: 10px 0 14px; }
.intro-dots { display: flex; gap: 8px; justify-content: center; margin-bottom: 4px; }
.intro-dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.25); }
.intro-dots i.on { background: var(--gold); }
button.big.ghost { background: transparent; border-color: var(--line); font-size: 15px; padding: 10px 20px; }

</style>
  <script>
    // 어떤 기기에서든 오류가 나면 화면에 표시 (테스터가 캡처해서 보낼 수 있게)
    window.addEventListener('error', function (e) {
      var box = document.getElementById('errbox') || document.body.appendChild(Object.assign(document.createElement('pre'), { id: 'errbox' }));
      box.style.cssText = 'position:fixed;left:0;right:0;top:0;z-index:99999;margin:0;padding:8px 10px;background:#7a1a1a;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;max-height:40vh;overflow:auto';
      box.textContent += '[오류] ' + (e.message || e.type) + (e.filename ? '  @' + e.filename.split('/').pop() + ':' + e.lineno : '') + String.fromCharCode(10) + (navigator.userAgent || '') + String.fromCharCode(10);
    });
    window.addEventListener('unhandledrejection', function (e) { window.dispatchEvent(new ErrorEvent('error', { message: 'Promise: ' + (e.reason && e.reason.message || e.reason) })); });
  </script>
</head>
<body>
  <div id="app">
    <canvas id="game" width="960" height="540"></canvas>
    <div id="ui"></div>
    <div id="rotate-hint">📱 가로로 돌려주세요</div>
  </div>
  <p class="footer">v0.1.0 (2026-09-19) · WASD 이동(화살표 가능) · J 공격 · K 마법 공격 · L 방어 · Shift 회피 · Space 점프 · 방향 조합+J 물리 스킬 / +K 마법 스킬(→=앞) · 1~4 단축 · F 상호작용 · Q 물약 · T 스킬 · I 가방 · M 지도 · F3 디버그 · <button id="touch-toggle" class="linkbtn">📱 터치 조작 표시</button></p>
